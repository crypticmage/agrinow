<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrinow — Users</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2d1f 100%);
            color: #f1f5f9;
            padding: 2rem;
        }

        /* ── Navbar ── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #4ade80;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-badge {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.25);
            border-radius: 999px;
            padding: 0.35rem 0.9rem;
            font-size: 0.8rem;
            color: #4ade80;
            font-weight: 500;
        }

        .btn-logout {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.25);
            color: #f87171;
            border-radius: 0.5rem;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        /* ── Header row ── */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .subtitle {
            font-size: 0.82rem;
            color: #64748b;
            margin-top: 0.2rem;
        }

        .btn-add {
            background: linear-gradient(135deg, #16a34a, #4ade80);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.85rem;
            border: none;
            border-radius: 0.6rem;
            padding: 0.55rem 1.1rem;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            transition: opacity 0.2s, transform 0.15s;
            display: inline-block;
        }

        .btn-add:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        /* ── Alert ── */
        #alert {
            display: none;
            padding: 0.9rem 1.2rem;
            border-radius: 0.7rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }

        #alert.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        /* ── Table card ── */
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* ── Search bar ── */
        .search-bar {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .search-bar input {
            width: 100%;
            max-width: 320px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.5rem 0.85rem;
            font-size: 0.875rem;
            color: #f1f5f9;
            font-family: inherit;
        }

        .search-bar input::placeholder {
            color: #475569;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #4ade80;
        }

        /* ── Table ── */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(0, 0, 0, 0.15);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        td {
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            color: #cbd5e1;
            white-space: nowrap;
        }

        td.name {
            color: #f1f5f9;
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .badge-active {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }

        .badge-inactive {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .role-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 0.35rem;
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
        }

        /* ── Skeleton loader ── */
        .skeleton-row td {
            padding: 0.9rem 1rem;
        }

        .skel {
            height: 0.75rem;
            border-radius: 0.4rem;
            background: rgba(255, 255, 255, 0.07);
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: #475569;
            font-size: 0.9rem;
        }

        /* ── Action Buttons & Modal ── */
        .btn-action {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 0.35rem 0.65rem;
            border-radius: 0.4rem;
            color: #f1f5f9;
            cursor: pointer;
            margin-right: 0.3rem;
            font-size: 0.75rem;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-action.delete {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
        }

        .btn-action.delete:hover {
            background: rgba(248, 113, 113, 0.25);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            transform: translateY(20px);
            transition: transform 0.2s;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .modal h2 {
            margin-bottom: 1.5rem;
            font-size: 1.25rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.6rem;
            color: #f1f5f9;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .btn-save {
            background: #4ade80;
            border: none;
            color: #0f172a;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
            </svg>
            Agrinow
        </div>
        <div class="nav-right">
            <span class="user-badge" id="userBadge">—</span>
            <a href="/change-password" class="btn-logout" style="background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); color: #f8fafc; text-decoration: none; display: flex; align-items: center; gap: 0.4rem;">
                <span style="font-size: 0.9rem;">🔑</span> Change Password
            </a>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <!-- Header -->
    <div class="header-row">
        <div>
            <h1>All Users</h1>
            <p class="subtitle" id="countLabel">Loading…</p>
        </div>
        <div>
            <a href="/user-logs" class="btn-add" id="logsBtn"
                style="background: rgba(255, 255, 255, 0.1); color: #f8fafc; margin-right: 0.5rem; transition: background 0.2s; display: none;">User
                Logs</a>
            <a href="/org-chart" class="btn-add"
                style="background: rgba(255, 255, 255, 0.1); color: #f8fafc; margin-right: 0.5rem; transition: background 0.2s;">View
                Org Chart</a>
            <a href="/register" class="btn-add">＋ Add User</a>
        </div>
    </div>

    <!-- Error alert -->
    <div id="alert"></div>

    <!-- Edit User Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>Update Employee Record</h2>
            <form id="editForm">
                <input type="hidden" id="editUserId" />
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="editRole" placeholder="e.g. farmer, agent, admin" />
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="editPhone" placeholder="+1234567890" />
                </div>
                <div class="form-group">
                    <label>Manager</label>
                    <select id="editManager">
                        <option value="">None</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Relieve Date</label>
                    <input type="date" id="editReliveDate" />
                    <small style="color:#64748b; font-size:0.7rem; display:block; margin-top:0.3rem;">If date is today
                        or earlier, the user becomes Inactive automatically.</small>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table card -->
    <div class="card">
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name, username, email, role…" />
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Hire Date</th>
                    <th>Emp Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- skeleton rows -->
                <tr class="skeleton-row">
                    <td>
                        <div class="skel" style="width:2rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:8rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:7rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:12rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:5rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:5rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:7rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:6rem"></div>
                    </td>
                </tr>
                <tr class="skeleton-row">
                    <td>
                        <div class="skel" style="width:2rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:9rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:6rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:13rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:4rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:5rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:7rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:7rem"></div>
                    </td>
                </tr>
                <tr class="skeleton-row">
                    <td>
                        <div class="skel" style="width:2rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:7rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:8rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:11rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:6rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:5rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:7rem"></div>
                    </td>
                    <td>
                        <div class="skel" style="width:5rem"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('agrinow_token');
        const username = localStorage.getItem('agrinow_username');
        const role = localStorage.getItem('agrinow_role');

        // Redirect to login if no token
        if (!token) { window.location.href = '/login'; }

        document.getElementById('userBadge').textContent =
            username ? `${username} · ${role}` : '—';

        if (role === 'manager' || role === 'admin') {
            document.getElementById('logsBtn').style.display = 'inline-block';
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch (e) {
                console.error("Logout API failed", e);
            }

            localStorage.removeItem('agrinow_token');
            localStorage.removeItem('agrinow_username');
            localStorage.removeItem('agrinow_role');
            window.location.href = '/login';
        });

        let allUsers = [];
        let allManagers = [];

        async function loadManagers() {
            try {
                const resp = await fetch('/users/manager_dropdown', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (resp.ok) {
                    allManagers = await resp.json();
                }
            } catch (e) {
                console.error("Failed to load manager list", e);
            }
        }

        async function loadUsers() {
            const alert = document.getElementById('alert');
            const body = document.getElementById('tableBody');
            const counter = document.getElementById('countLabel');
            try {
                const resp = await fetch('/users/?limit=200', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (resp.status === 401) {
                    localStorage.removeItem('agrinow_token');
                    window.location.href = '/login';
                    return;
                }

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || resp.statusText);
                }

                allUsers = await resp.json();
                renderTable(allUsers);
                counter.textContent = `${allUsers.length} user${allUsers.length !== 1 ? 's' : ''} registered`;
            } catch (e) {
                body.innerHTML = `<tr><td colspan="8" class="empty">Failed to load users.</td></tr>`;
                alert.className = 'error';
                alert.textContent = `❌ ${e.message}`;
                counter.textContent = '';
            }
        }

        function renderTable(users) {
            const body = document.getElementById('tableBody');
            if (!users.length) {
                body.innerHTML = `<tr><td colspan="9" class="empty">No users found.</td></tr>`;
                return;
            }
            body.innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td class="name">${u.first_name} ${u.last_name}</td>
          <td>${u.username}</td>
          <td>${u.email}</td>
          <td><span class="role-badge">${u.role}</span></td>
          <td><span class="badge ${u.is_active ? 'badge-active' : 'badge-inactive'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>${u.hire_date ?? '—'}</td>
          <td>${u.emp_type ?? '—'}</td>
          <td>
             <button class="btn-action" onclick="openEditModal(${u.id})">Edit</button>
             <button class="btn-action delete" onclick="deleteUser(${u.id}, '${u.username}')">Delete</button>
          </td>
        </tr>`).join('');
        }

        // Live search / filter
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u =>
                `${u.first_name} ${u.last_name} ${u.username} ${u.email} ${u.role}`.toLowerCase().includes(q)
            );
            renderTable(filtered);
        });

        // ── Modal & Update Logic ──
        function populateManagerDropdown(excludeUserId, currentManagerId) {
            const select = document.getElementById('editManager');
            select.innerHTML = '<option value="">None</option>';

            allManagers.forEach(m => {
                // A user shouldn't be their own manager
                if (m.id !== excludeUserId) {
                    const option = document.createElement('option');
                    option.value = m.id;
                    option.textContent = `${m.first_name} ${m.last_name} (@${m.username})`;
                    if (currentManagerId && currentManagerId === m.id) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                }
            });
        }

        function openEditModal(id) {
            const user = allUsers.find(u => u.id === id);
            if (!user) return;
            document.getElementById('editUserId').value = user.id;
            document.getElementById('editRole').value = user.role || '';
            document.getElementById('editPhone').value = user.phone || '';
            document.getElementById('editReliveDate').value = user.relive_date || '';
            document.getElementById('editStatus').value = user.is_active ? "true" : "false";

            populateManagerDropdown(user.id, user.manager_id);

            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editUserId').value;
            const managerVal = document.getElementById('editManager').value;

            const payload = {
                role: document.getElementById('editRole').value,
                phone: document.getElementById('editPhone').value || null,
                relive_date: document.getElementById('editReliveDate').value || null,
                is_active: document.getElementById('editStatus').value === "true",
                manager_id: managerVal ? parseInt(managerVal) : null
            };

            try {
                const resp = await fetch(`/users/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    alert(`Failed to update user: ${err.detail}`);
                } else {
                    closeEditModal();
                    loadUsers(); // Refresh table
                }
            } catch (err) {
                alert("Error updating user.");
            }
        });

        async function deleteUser(id, username) {
            if (!confirm(`Are you sure you want to permanently delete user '${username}'?`)) return;
            try {
                const resp = await fetch(`/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    alert(`Failed to delete user: ${err.detail}`);
                } else {
                    loadUsers(); // Refresh table
                }
            } catch (err) {
                alert("Error deleting user.");
            }
        }

        // Load dependencies in parallel
        Promise.all([loadManagers(), loadUsers()]);
    </script>
</body>

</html>
