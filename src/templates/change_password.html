<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrinow — Setup Your Password</title>
    <meta name="description" content="Secure your account by setting a new password." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2d1f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 0.5rem;
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.6rem;
            padding: 0.7rem 0.9rem;
            font-size: 0.9rem;
            color: #f1f5f9;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
            width: 100%;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            outline: none;
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.06);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 2.8rem;
        }

        .toggle-pw {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: #4ade80;
        }

        .toggle-pw svg {
            width: 18px;
            height: 18px;
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #16a34a, #4ade80);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 0.7rem;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #response {
            margin-top: 1.2rem;
            padding: 1rem 1.2rem;
            border-radius: 0.7rem;
            font-size: 0.875rem;
            display: none;
            word-break: break-all;
        }

        #response.success {
            display: block;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        #response.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .password-strength {
            height: 3px;
            border-radius: 3px;
            margin-top: 0.3rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.06);
        }

        .password-strength .bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
                Agrinow
            </div>
            <div class="lock-icon">🔒</div>
            <h1>Update Password</h1>
            <p class="subtitle">Change your current password to a new secure one. This will also securely re-generate
                your encryption keys.</p>
        </div>

        <form id="changeForm">
            <div class="fields">

                <div class="field">
                    <label for="currentPassword">Current Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="currentPassword" name="currentPassword" placeholder="••••••••••"
                            autocomplete="current-password" required />
                        <button type="button" class="toggle-pw" id="togglePw0" aria-label="Show/hide password">
                            <svg id="eyeIcon0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="newPassword">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" name="newPassword" placeholder="••••••••••"
                            autocomplete="new-password" required minlength="6" />
                        <button type="button" class="toggle-pw" id="togglePw1" aria-label="Show/hide password">
                            <svg id="eyeIcon1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="field">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPasswordConfirm" name="newPasswordConfirm"
                            placeholder="••••••••••" autocomplete="new-password" required minlength="6" />
                        <button type="button" class="toggle-pw" id="togglePw2" aria-label="Show/hide password">
                            <svg id="eyeIcon2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">🔑 Update Password</button>

            </div>
        </form>

        <div id="response"></div>

        <p class="footer-link">
            <a href="/users-page">← Back to Dashboard</a>
        </p>
    </div>

    <script>
        const token = localStorage.getItem('agrinow_token');
        if (!token) {
            window.location.href = '/login';
        }

        // Eye icon SVGs
        const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        const eyeClosed = `<line x1="1" y1="1" x2="23" y2="23"/><path d="M10.73 5.08A10.43 10.43 0 0112 5c7 0 11 7 11 7a13.16 13.16 0 01-1.67 2.68M6.61 6.61A13.526 13.526 0 002 12s4 7 10 7a9.74 9.74 0 005.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/>`;

        // Toggle password visibility for both fields
        function setupToggle(btnId, inputId, iconId) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.addEventListener('click', () => {
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                icon.innerHTML = isHidden ? eyeClosed : eyeOpen;
            });
        }
        setupToggle('togglePw0', 'currentPassword', 'eyeIcon0');
        setupToggle('togglePw1', 'newPassword', 'eyeIcon1');
        setupToggle('togglePw2', 'newPasswordConfirm', 'eyeIcon2');

        // Password strength indicator
        document.getElementById('newPassword').addEventListener('input', (e) => {
            const val = e.target.value;
            const bar = document.getElementById('strengthBar');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const widths = ['0%', '20%', '40%', '60%', '80%', '100%'];
            const colors = ['transparent', '#ef4444', '#f97316', '#eab308', '#22c55e', '#4ade80'];
            bar.style.width = widths[score];
            bar.style.background = colors[score];
        });

        // Form submit
        document.getElementById('changeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const res = document.getElementById('response');
            const currentPw = document.getElementById('currentPassword').value;
            const newPw = document.getElementById('newPassword').value;
            const confirmPw = document.getElementById('newPasswordConfirm').value;

            if (newPw !== confirmPw) {
                res.className = 'error';
                res.textContent = '❌ Passwords do not match.';
                res.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating…';
            res.style.display = 'none';

            try {
                const response = await fetch('/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ current_password: currentPw, new_password: newPw }),
                });
                const data = await response.json();

                if (response.ok) {
                    res.className = 'success';
                    res.innerHTML = `
                        <div style="font-weight:600;font-size:0.95rem;margin-bottom:0.4rem">
                            ✅ Password Updated Successfully
                        </div>
                        <div style="font-size:0.8rem;color:#86efac">Redirecting back…</div>`;
                    res.style.display = 'block';
                    setTimeout(() => { window.location.href = '/users-page'; }, 2000);
                } else {
                    res.className = 'error';
                    res.textContent = `❌ ${data.detail || JSON.stringify(data)}`;
                    res.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '🔑 Update Password';
                }
            } catch (err) {
                res.className = 'error';
                res.textContent = `❌ Network error: ${err.message}`;
                res.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '🔑 Update Password';
            }
        });
    </script>
</body>

</html>
