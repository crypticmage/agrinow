<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrinow — Login</title>
    <meta name="description" content="Sign in to Agrinow — the agricultural operations platform." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2d1f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 0.5rem;
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.6rem;
            padding: 0.7rem 0.9rem;
            font-size: 0.9rem;
            color: #f1f5f9;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
            width: 100%;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            outline: none;
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.06);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 2.8rem;
        }

        .toggle-pw {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: #4ade80;
        }

        .toggle-pw svg {
            width: 18px;
            height: 18px;
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #16a34a, #4ade80);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 0.7rem;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #response {
            margin-top: 1.2rem;
            padding: 1rem 1.2rem;
            border-radius: 0.7rem;
            font-size: 0.875rem;
            display: none;
            word-break: break-all;
        }

        #response.success {
            display: block;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        #response.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        .token-box {
            margin-top: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(74, 222, 128, 0.15);
            border-radius: 0.5rem;
            padding: 0.7rem 0.9rem;
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: #94a3b8;
            word-break: break-all;
            line-height: 1.5;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.82rem;
            color: #64748b;
        }

        .footer-link a {
            color: #4ade80;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
                Agrinow
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your account</p>
        </div>

        <form id="loginForm">
            <div class="fields">

                <div class="field">
                    <label for="identifier">Username or Email</label>
                    <input type="text" id="identifier" name="identifier" placeholder="john_doe or john@example.com"
                        autocomplete="username" required />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••••"
                            autocomplete="current-password" required />
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show/hide password"
                            title="Toggle password visibility">
                            <!-- eye icon -->
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">🔓 Sign In</button>

            </div>
        </form>

        <div id="response"></div>

        <p class="footer-link">
            Don't have an account? <a href="/register">Register</a>
        </p>
    </div>

    <script>
        // Toggle password visibility
        const togglePw = document.getElementById('togglePw');
        const pwInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        const eyeOpen = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        const eyeClosed = `<line x1="1" y1="1" x2="23" y2="23"/><path d="M10.73 5.08A10.43 10.43 0 0112 5c7 0 11 7 11 7a13.16 13.16 0 01-1.67 2.68M6.61 6.61A13.526 13.526 0 002 12s4 7 10 7a9.74 9.74 0 005.39-1.61"/><line x1="1" y1="1" x2="23" y2="23"/>`;

        togglePw.addEventListener('click', () => {
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            eyeIcon.innerHTML = isHidden ? eyeClosed : eyeOpen;
        });

        // Login form submit
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const res = document.getElementById('response');

            btn.disabled = true;
            btn.textContent = 'Signing in…';
            res.className = '';
            res.style.display = 'none';

            const form = e.target;
            const body = {
                identifier: form.identifier.value.trim(),
                password: form.password.value,
            };

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await response.json();

                if (response.ok) {
                    // Store token so other pages can use it
                    localStorage.setItem('agrinow_token', data.access_token);
                    localStorage.setItem('agrinow_username', data.username);
                    localStorage.setItem('agrinow_role', data.role);

                    res.className = 'success';
                    res.innerHTML = `
                        <div style="font-weight:600;font-size:0.95rem;margin-bottom:0.4rem">
                            ✅ Signed in as <strong>${data.username}</strong> &middot; <span style="opacity:0.8">${data.role}</span>
                        </div>
                        <div style="font-size:0.8rem;color:#86efac">Redirecting to dashboard…</div>`;
                    setTimeout(() => { window.location.href = '/users-page'; }, 800);
                } else {
                    res.className = 'error';
                    res.textContent = `❌ ${data.detail || JSON.stringify(data)}`;
                }
            } catch (err) {
                res.className = 'error';
                res.textContent = `❌ Network error: ${err.message}`;
            }

            btn.disabled = false;
            btn.textContent = '🔓 Sign In';
        });
    </script>
</body>

</html>
