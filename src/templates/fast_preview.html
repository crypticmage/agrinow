<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinow — Fast Preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: fixed;
            top: 0; width: 100%;
            z-index: 10;
        }
        .back-btn {
            color: #4ade80;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            background: rgba(74, 222, 128, 0.1);
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(74, 222, 128, 0.2);
            transform: translateX(-2px);
        }
        .viewer-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-top: 60px; /* Header space */
        }
        #mainImage {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 4px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .loading-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #4ade80;
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px #4ade80;
        }
        .status-badge {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.1);
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
        }
        .status-badge.hd {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="javascript:history.back()" class="back-btn">← Back</a>
        <div id="fileName" style="font-size: 0.85rem; color: #94a3b8;">Loading...</div>
        <div style="width: 50px;"></div>
    </div>

    <div class="viewer-container">
        <img id="mainImage" src="" alt="Preview" />
    </div>

    <div class="loading-bar" id="progressBar"></div>
    <div class="status-badge" id="statusBadge">FAST PREVIEW (BASE64)</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const imageId = params.get('id');
        const token = localStorage.getItem('agrinow_token');

        const imageEl = document.getElementById('mainImage');
        const progressBar = document.getElementById('progressBar');
        const statusBadge = document.getElementById('statusBadge');
        const fileNameEl = document.getElementById('fileName');

        if (!token) window.location.href = '/login';
        if (!imageId) document.body.innerHTML = 'No ID';

        async function init() {
            // 1. Load Thumbnail (Instant)
            try {
                const thumbRes = await fetch(`/images/base/${imageId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (thumbRes.ok) {
                    const thumb = await thumbRes.json();
                    imageEl.src = thumb.data_uri;
                    statusBadge.textContent = 'FAST PREVIEW (BASE64)';
                }
            } catch (e) {}

            // 2. Load HD Blob (High Quality)
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', `/images/${imageId}`);
                xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                xhr.responseType = 'blob';

                xhr.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const percent = (e.loaded / e.total) * 100;
                        progressBar.style.width = percent + '%';
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        const blob = xhr.response;
                        const url = URL.createObjectURL(blob);
                        
                        // Cross-fade to HD
                        imageEl.style.opacity = '0';
                        setTimeout(() => {
                            imageEl.src = url;
                            imageEl.style.opacity = '1';
                            statusBadge.textContent = 'HD VIEW (BLOB)';
                            statusBadge.className += ' hd';
                            progressBar.style.width = '100%';
                            setTimeout(() => progressBar.style.opacity = '0', 500);
                        }, 300);
                    }
                };

                xhr.send();
            } catch (e) {}
        }

        init();
    </script>
</body>
</html>
