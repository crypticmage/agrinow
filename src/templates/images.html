<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrinow — Image Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2d1f 100%);
            color: #f1f5f9;
            padding: 2rem;
        }

        /* ── Navbar ── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: #4ade80;
            text-decoration: none;
        }

        .logo svg {
            width: 24px;
            height: 24px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-badge {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.25);
            border-radius: 999px;
            padding: 0.35rem 0.9rem;
            font-size: 0.8rem;
            color: #4ade80;
            font-weight: 500;
        }

        .btn-logout {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.25);
            color: #f87171;
            border-radius: 0.5rem;
            padding: 0.35rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: rgba(248, 113, 113, 0.2);
        }

        /* ── Header row ── */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .subtitle {
            font-size: 0.82rem;
            color: #64748b;
            margin-top: 0.2rem;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            font-weight: 600;
            font-size: 0.85rem;
            border: none;
            border-radius: 0.6rem;
            padding: 0.55rem 1.1rem;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ── Upload Box ── */
        .upload-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(74, 222, 128, 0.5);
            border-radius: 1.25rem;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: background 0.2s;
        }
        
        .upload-section:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        h3 {
            margin-bottom: 1rem;
            color: #4ade80;
        }

        input[type="file"] {
            margin-bottom: 1rem;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .btn-upload {
            background: #4ade80;
            color: #0f172a;
            font-weight: 600;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .btn-upload:hover {
            opacity: 0.9;
        }

        /* ── Alert ── */
        #alert {
            display: none;
            padding: 0.9rem 1.2rem;
            border-radius: 0.7rem;
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }

        #alert.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
        }
        
        #alert.success {
            display: block;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        /* ── Table card ── */
        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 1.25rem;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        /* ── Table ── */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 0.75rem 1rem;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(0, 0, 0, 0.15);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        td {
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            color: #cbd5e1;
            white-space: nowrap;
        }
        
        a.view-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        
        a.view-link:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: #475569;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="/users-page" class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
            </svg>
            Agrinow
        </a>
        <div class="nav-right">
            <span class="user-badge" id="userBadge">—</span>
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <!-- Header -->
    <div class="header-row">
        <div>
            <h1>Image Management</h1>
            <p class="subtitle" id="countLabel">Loading stored images…</p>
        </div>
        <a href="/users-page" class="btn-back">← Back to Users</a>
    </div>

    <!-- Alert -->
    <div id="alert"></div>

    <!-- Upload Section -->
    <div class="upload-section">
        <h3>Upload New Image</h3>
        <input type="file" id="imageInput" accept="image/*" />
        <br>
        <button class="btn-upload" id="uploadBtn">Upload & Compress</button>
    </div>

    <!-- Images Table -->
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>File Name</th>
                    <th>Format</th>
                    <th>Size (KB)</th>
                    <th>Stored At (UTC)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="6" class="empty">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const token = localStorage.getItem('agrinow_token');
        const username = localStorage.getItem('agrinow_username');
        const role = localStorage.getItem('agrinow_role');

        if (!token) { window.location.href = '/login'; }

        // Populate User Badge
        document.getElementById('userBadge').textContent =
            username ? `${username} · ${role}` : '—';

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch('/auth/logout', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            } catch (e) { console.error("Logout API failed", e); }
            localStorage.removeItem('agrinow_token');
            localStorage.removeItem('agrinow_username');
            localStorage.removeItem('agrinow_role');
            window.location.href = '/login';
        });

        // Load Images
        async function loadImages() {
            const body = document.getElementById('tableBody');
            const alertBox = document.getElementById('alert');
            const counter = document.getElementById('countLabel');
            try {
                const resp = await fetch('/images/list', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (resp.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || resp.statusText);
                }

                const images = await resp.json();

                if (!images.length) {
                    body.innerHTML = `<tr><td colspan="6" class="empty">No images found. Upload one above.</td></tr>`;
                    counter.textContent = '0 images';
                    return;
                }

                counter.textContent = `Showing ${images.length} images`;

                body.innerHTML = images.map(img => {
                    const d = new Date(img.created_at);
                    const sizeKB = Math.round(img.size / 1024);
                    return `
                        <tr>
                            <td>${img.id}</td>
                            <td style="color: #f1f5f9; font-weight: 500;">${img.file_name}</td>
                            <td>${img.format}</td>
                            <td>${sizeKB} KB</td>
                            <td>${img.created_at ? d.toLocaleString() : 'N/A'}</td>
                            <td><a href="/view-image?id=${img.id}" target="_blank" class="view-link">View Image</a></td>
                        </tr>
                    `;
                }).join('');

            } catch (e) {
                body.innerHTML = `<tr><td colspan="6" class="empty">Failed to load images.</td></tr>`;
                alertBox.className = 'error';
                alertBox.textContent = `❌ ${e.message}`;
            }
        }
        
        // Handle Upload
        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('imageInput');
            const alertBox = document.getElementById('alert');
            const file = fileInput.files[0];
            
            if (!file) {
                alertBox.className = 'error';
                alertBox.textContent = '❌ Please select an image to upload.';
                return;
            }
            
            const formData = new FormData();
            formData.append("file", file);
            
            document.getElementById('uploadBtn').textContent = 'Uploading...';
            document.getElementById('uploadBtn').disabled = true;
            
            try {
               const resp = await fetch('/images/', {
                   method: 'POST',
                   headers: { 'Authorization': `Bearer ${token}` }, // Note: depending on how Depends(get_current_user) is set on images API. If no auth is on /images yet, this header won't hurt.
                   body: formData
               });
               
               if (!resp.ok) {
                   const err = await resp.json();
                   throw new Error(err.detail || 'Upload failed');
               }
               
               alertBox.className = 'success';
               alertBox.textContent = '✅ Image uploaded and compressed successfully!';
               fileInput.value = ''; // Clear input
               loadImages(); // Refresh the table
               
            } catch (e) {
               alertBox.className = 'error';
               alertBox.textContent = `❌ ${e.message}`;
            } finally {
               document.getElementById('uploadBtn').textContent = 'Upload & Compress';
               document.getElementById('uploadBtn').disabled = false;
               
               // Clear alert after 5 seconds
               setTimeout(() => {
                   if (alertBox.className === 'success') {
                       alertBox.className = '';
                       alertBox.style.display = 'none';
                   }
               }, 5000);
            }
        });

        // Initialize table
        loadImages();
    </script>
</body>

</html>
