<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrinow — Forgot Password</title>
    <meta name="description" content="Reset your Agrinow password." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2d1f 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.4rem;
            font-weight: 700;
            color: #4ade80;
            margin-bottom: 0.5rem;
        }

        .logo svg {
            width: 28px;
            height: 28px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        .fields {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.8rem;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.6rem;
            padding: 0.7rem 0.9rem;
            font-size: 0.9rem;
            color: #f1f5f9;
            font-family: inherit;
            transition: border-color 0.2s, background 0.2s;
            width: 100%;
        }

        input::placeholder {
            color: #475569;
        }

        input:focus {
            outline: none;
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.06);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #16a34a, #4ade80);
            color: #0f172a;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 0.7rem;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #response {
            margin-top: 1.2rem;
            padding: 1rem 1.2rem;
            border-radius: 0.7rem;
            font-size: 0.875rem;
            display: none;
            word-break: break-all;
        }

        #response.success {
            display: block;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
        }

        #response.error {
            display: block;
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.82rem;
            color: #64748b;
        }

        .footer-link a {
            color: #4ade80;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .lock-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z" />
                    <path d="M2 17l10 5 10-5" />
                    <path d="M2 12l10 5 10-5" />
                </svg>
                Agrinow
            </div>
            <div class="lock-icon">🔒</div>
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>
        </div>

        <form id="forgotForm">
            <div class="fields">

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com"
                        autocomplete="email" required />
                </div>

                <button type="submit" class="btn" id="submitBtn">📧 Send Reset Link</button>

            </div>
        </form>

        <div id="response"></div>

        <p class="footer-link">
            Remember your password? <a href="/login">Sign In</a>
        </p>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const res = document.getElementById('response');

            btn.disabled = true;
            btn.textContent = 'Sending…';
            res.className = '';
            res.style.display = 'none';

            const body = {
                email: document.getElementById('email').value.trim(),
            };

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await response.json();

                if (response.ok) {
                    res.className = 'success';
                    res.innerHTML = `
                        <div style="font-weight:600;font-size:0.95rem;margin-bottom:0.4rem">
                            ✅ Check your inbox!
                        </div>
                        <div style="font-size:0.8rem;color:#86efac">
                            ${data.message}
                        </div>`;
                } else {
                    res.className = 'error';
                    res.textContent = `❌ ${data.detail || JSON.stringify(data)}`;
                }
            } catch (err) {
                res.className = 'error';
                res.textContent = `❌ Network error: ${err.message}`;
            }

            btn.disabled = false;
            btn.textContent = '📧 Send Reset Link';
        });
    </script>
</body>

</html>
