name: API Dev Deploy
on:
  push:
    branches: [ your-experimental-branch ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PY_DEV }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./  # Keep it simple
          # IMPORTANT: This prevents the 553 error on reset servers
          state-name: .ftp-deploy-sync-state.json 
          exclude: |
            **/venv/**
            **/.git*
            **/.github/**
            **/__pycache__/**
