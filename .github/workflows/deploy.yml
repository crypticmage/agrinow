name: 🐍 API Dev Deploy
on:
  push:
    branches: [ your-test-branch ] # Change to your experimental branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📂 Sync to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PY_DEV }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./
          server-dir: ./
          exclude: |
            **/venv/**
            **/.git*
            **/.github/**
            **/__pycache__/**
